name: when2meet

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-when2meet}
      POSTGRES_USER: ${DB_USER:-when2meet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-when2meet-dev-only}
    volumes:
      - when2meet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-when2meet} -d ${DB_NAME:-when2meet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-when2meet}
      DB_USER: ${DB_USER:-when2meet}
      DB_PASSWORD: ${DB_PASSWORD:-when2meet-dev-only}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:3000:3000"
    restart: unless-stopped

volumes:
  when2meet-db:
